<p-toolbar>
  <ng-template #start>
    <a routerLink="/demo" class="brand">Snippet Library</a>
  </ng-template>
  <ng-template #end>
    <div class="toolbar-actions">
      <p-button routerLink="/demo" label="Démo publique" icon="pi pi-compass" severity="secondary" [outlined]="true" />
      <p-button
        [icon]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        [label]="theme.isDark() ? 'Thème clair' : 'Thème sombre'"
        [ariaLabel]="theme.isDark() ? 'Activer le thème clair' : 'Activer le thème sombre'"
        severity="secondary"
        [outlined]="true"
        (click)="theme.toggle()"
      />
      <p-button label="Connexion bientôt disponible" icon="pi pi-sign-in" severity="secondary" [outlined]="true" [disabled]="true" />
    </div>
  </ng-template>
</p-toolbar>

<main class="application-content">
  <app-demo-search-bar />
  <router-outlet />
</main>
